name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validar, testar e compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Executar validações
        run: pnpm check

  interface:
    name: Testar interface móvel
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Obter código
        uses: actions/checkout@v6

      - name: Instalar pnpm
        uses: pnpm/action-setup@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Executar fluxo móvel
        run: pnpm e2e

      - name: Publicar relatório em caso de falha
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
